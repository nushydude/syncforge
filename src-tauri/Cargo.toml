[package]
name = "syncforge"
version = "0.7.1"
description = "SyncForge — modern desktop folder sync"
authors = ["SyncForge"]
edition = "2021"

[lib]
name = "syncforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
notify = "7"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
jwalk = "0.8"
globset = "0.4"
blake3 = "1"
trash = "5"
tokio = { version = "1", features = ["time", "macros", "sync"] }
cron = "0.15"
chrono = "0.4"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
